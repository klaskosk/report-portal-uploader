name: Container image PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: rpu:pull-request
          provenance: false
          sbom: false
          cache-from: type=gha

      - name: Verify container entrypoint
        run: docker run --rm rpu:pull-request --help
